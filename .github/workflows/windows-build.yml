name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SonyFocusViewer --collect-all rawpy --collect-all pillow_heif app.py
      - uses: actions/upload-artifact@v4
        with:
          name: SonyFocusViewer-Windows
          path: dist/SonyFocusViewer.exe
          if-no-files-found: error
